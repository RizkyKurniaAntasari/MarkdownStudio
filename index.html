<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Markdown Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233b6ef2'/%3E%3Cpath d='M20 72V28h12l14 19 14-19h12v44H60V47L46 66 32 47v25z' fill='white'/%3E%3C/svg%3E">
<style>
/* =========================================================
   Markdown Studio - offline single-file editor + preview
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}

:root{
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --f-mono:"JetBrains Mono","Cascadia Mono","SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
  --r:8px; --r-sm:6px;
  --ed-size:14px; --pv-size:16px;
  /* the readable column both panes centre themselves in, so text does not run
     the full width of a maximised window */
  --col:820px; --gut:24px;
  --tr:.15s ease;
  --bg:#fff; --bg2:#f6f7f9; --bg3:#ecedf1; --panel:#fbfbfd;
  --fg:#1c1f24; --fg2:#4d545e; --fg3:#8a919c;
  --bd:#e3e6eb; --bd2:#cfd5dd;
  --acc:#3b6ef2; --acc2:#2a53c4; --accsoft:#e9f0ff; --accfg:#fff;
  --code:#f4f6f8; --codebd:#e5e8ed; --codehd:#eceff3;
  --ok:#17794d; --warn:#9a5b00; --danger:#cf222e; --info:#0969da; --purple:#8250df;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.10);
  --sy-com:#7b8494; --sy-str:#0a7b52; --sy-num:#b3541e; --sy-kw:#8250df;
  --sy-fn:#1f6feb; --sy-tag:#cf222e; --sy-attr:#8250df; --sy-op:#5b6472;
  --sy-var:#953800; --sy-ins:#17794d; --sy-del:#cf222e;
}
:root[data-theme="dark"]{
  --bg:#14171c; --bg2:#191d23; --bg3:#232931; --panel:#171b20;
  --fg:#e5e8ee; --fg2:#a6aeba; --fg3:#6e7783;
  --bd:#262c34; --bd2:#343c46;
  --acc:#6d9bff; --acc2:#8fb4ff; --accsoft:#1b2740; --accfg:#0d1117;
  --code:#1a1f26; --codebd:#262c34; --codehd:#1f252d;
  --ok:#3fb950; --warn:#d29922; --danger:#ff7b72; --info:#58a6ff; --purple:#d2a8ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.5);
  --sy-com:#6e7783; --sy-str:#7ee2a8; --sy-num:#ffab70; --sy-kw:#d2a8ff;
  --sy-fn:#79c0ff; --sy-tag:#ff7b72; --sy-attr:#d2a8ff; --sy-op:#a6aeba;
  --sy-var:#ffa657; --sy-ins:#3fb950; --sy-del:#ff7b72;
}

html,body{height:100%}
body{
  margin:0;font-family:var(--f-ui);background:var(--bg);color:var(--fg);
  font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--fg3);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ---------------- sidebar ---------------- */
#sidebar{
  width:252px;flex:0 0 252px;background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;transition:margin-left var(--tr);min-width:0;
}
body.no-sidebar #sidebar{margin-left:-252px}
.side-head{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:-.01em;font-size:13.5px}
.logo-mark{width:22px;height:22px;border-radius:6px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 22px}
.side-tabs{display:flex;gap:2px;padding:8px 8px 2px}
.side-tab{flex:1;padding:6px 4px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--fg3);font-size:12px;font-weight:600;cursor:pointer;transition:var(--tr)}
.side-tab:hover{background:var(--bg3);color:var(--fg2)}
.side-tab[aria-selected="true"]{background:var(--accsoft);color:var(--acc)}
.side-body{flex:1;overflow-y:auto;padding:8px;min-height:0}
.side-foot{padding:8px;border-top:1px solid var(--bd);display:flex;gap:6px}
#docSearch{width:100%;padding:6px 9px;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--bg);font-size:12.5px;margin-bottom:8px}
#docSearch::placeholder{color:var(--fg3)}

.doc{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;transition:var(--tr);margin-bottom:1px}
.doc:hover{background:var(--bg3)}
.doc.active{background:var(--accsoft)}
.doc.active .doc-name{color:var(--acc);font-weight:600}
.doc-main{flex:1;min-width:0}
.doc-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.doc-meta{font-size:11px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-del{opacity:0;border:0;background:transparent;color:var(--fg3);cursor:pointer;padding:3px;border-radius:4px;line-height:0;flex:0 0 auto}
.doc:hover .doc-del,.doc-del:focus{opacity:1}
.doc-del:hover{background:var(--bd2);color:var(--danger)}

.toc-item{display:block;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:4px 8px;border-radius:var(--r-sm);color:var(--fg2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:var(--tr)}
.toc-item:hover{background:var(--bg3);color:var(--fg)}
.toc-l1{font-weight:650;color:var(--fg)}
.toc-l2{padding-left:20px}
.toc-l3{padding-left:34px;font-size:12px}
.toc-l4,.toc-l5,.toc-l6{padding-left:48px;font-size:12px;color:var(--fg3)}
.empty{color:var(--fg3);font-size:12.5px;text-align:center;padding:24px 14px;line-height:1.7}

/* ---------------- main ---------------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--panel);flex:0 0 auto}
#docTitle{border:1px solid transparent;background:transparent;font-size:14px;font-weight:600;padding:5px 8px;border-radius:var(--r-sm);min-width:60px;flex:1;max-width:430px}
#docTitle:hover{background:var(--bg3)}
#docTitle:focus{background:var(--bg);border-color:var(--bd2);outline:none}
.grow{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 9px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--fg2);cursor:pointer;transition:var(--tr);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg3);color:var(--fg)}
.btn:active{transform:translateY(.5px)}
.btn.on{background:var(--accsoft);color:var(--acc)}
.btn-pri{background:var(--acc);color:var(--accfg);font-weight:600}
.btn-pri:hover{background:var(--acc2);color:var(--accfg)}
.btn-out{border-color:var(--bd2)}
.btn-out:hover{border-color:var(--fg3)}
.btn-ico{width:30px;padding:0}
.btn svg{width:15px;height:15px;flex:0 0 auto}

.seg{display:flex;background:var(--bg3);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg .btn{height:26px;border-radius:5px;padding:0 10px;font-size:12px}
.seg .btn.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14);font-weight:600}
:root[data-theme="dark"] .seg .btn.on{background:var(--bd2)}

/* ---------------- toolbar ---------------- */
#toolbar{display:flex;align-items:center;gap:1px;padding:5px 8px;flex-wrap:wrap;border-bottom:1px solid var(--bd);background:var(--bg);flex:0 0 auto}
body.view-preview #toolbar{display:none}
.sep{width:1px;height:18px;background:var(--bd);margin:0 5px;flex:0 0 auto}
.tb{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:var(--r-sm);color:var(--fg2);cursor:pointer;transition:var(--tr)}
.tb:hover{background:var(--accsoft);color:var(--acc)}
.tb svg{width:16px;height:16px;pointer-events:none}
.tb.txt{width:auto;padding:0 8px;font-size:12px;font-weight:700;letter-spacing:.01em}

/* ---------------- find bar ---------------- */
#findbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--bd);flex:0 0 auto;flex-wrap:wrap}
#findbar[hidden]{display:none}
#findbar input[type=text]{padding:5px 8px;border:1px solid var(--bd2);border-radius:var(--r-sm);background:var(--bg);font-size:12.5px;min-width:120px;flex:1;max-width:230px}
#findCount{font-size:12px;color:var(--fg3);min-width:64px;font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--fg2);cursor:pointer;user-select:none}
.chk input{margin:0;accent-color:var(--acc)}

/* ---------------- panes ---------------- */
#panes{flex:1;display:grid;grid-template-columns:var(--split,50%) 7px 1fr;min-height:0;overflow:hidden;position:relative}
/* hidden panes leave the grid flow, so the single remaining pane must own col 1 */
body.view-edit #panes,body.view-preview #panes{grid-template-columns:1fr}
body.view-edit #splitter,body.view-preview #splitter,
body.view-edit #previewPane,body.view-preview #editorPane{display:none}
#splitter{background:var(--bd);cursor:col-resize;position:relative;transition:background var(--tr)}
#splitter::after{content:"";position:absolute;inset:0 -4px;z-index:5}
#splitter:hover,#splitter.drag{background:var(--acc)}

#editorPane{position:relative;min-width:0;display:flex;background:var(--bg);overflow:hidden}
#editor{
  flex:1;width:100%;border:0;resize:none;outline:none;background:transparent;color:var(--fg);
  font-family:var(--f-mono);font-size:var(--ed-size);line-height:1.75;
  padding:20px max(var(--gut),(100% - var(--col))/2) 45vh;
  tab-size:2;white-space:pre-wrap;word-wrap:break-word;
  overflow-y:auto;overflow-x:hidden;caret-color:var(--acc);
  position:relative;z-index:1;
}
body.nowrap #editor{white-space:pre;overflow-x:auto;word-wrap:normal}
/* Doubles as a hidden measuring rig and, during a search, a highlight layer
   painted behind the transparent textarea. */
#mirror{position:absolute;top:0;left:0;visibility:hidden;pointer-events:none;z-index:0;color:transparent;font-family:var(--f-mono);font-size:var(--ed-size);line-height:1.75;padding:20px max(var(--gut),(100% - var(--col))/2) 45vh;white-space:pre-wrap;word-wrap:break-word;overflow:hidden}
#mirror.hl{visibility:visible}
#mirror mark{background:color-mix(in srgb,#ffd84d 80%,transparent);color:transparent;border-radius:2px}
#mirror mark.cur{background:color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 0 0 1.5px var(--acc)}
:root[data-theme="dark"] #mirror mark{background:color-mix(in srgb,#d29922 60%,transparent)}
:root[data-theme="dark"] #mirror mark.cur{background:color-mix(in srgb,var(--acc) 55%,transparent)}
#previewPane{overflow-y:auto;overflow-x:hidden;min-width:0;background:var(--bg)}
#preview{padding:24px 34px 45vh;max-width:var(--col);margin:0 auto;font-size:var(--pv-size)}
/* "Wide" drops the column on both panes, for wide tables and side-by-side reading */
body.wide #preview{max-width:none}
body.wide #editor,body.wide #mirror{padding-left:var(--gut);padding-right:var(--gut)}

/* ---------------- status ---------------- */
#status{display:flex;align-items:center;gap:14px;padding:5px 12px;font-size:11.5px;color:var(--fg3);border-top:1px solid var(--bd);background:var(--panel);flex:0 0 auto;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
#status b{font-weight:600;color:var(--fg2)}
#saveState{display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.dot.ok{background:var(--ok)}
.dot.dirty{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.dot.warn{background:var(--warn)}
.dot.browser{background:var(--fg3)}
#saveState{cursor:help}
#saveState.is-dirty{color:var(--warn);font-weight:600}
/* a badge on Save so pending changes are visible without reading the status bar */
#btnSave{position:relative}
#btnSave.pending::after{
  content:"";position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;
  background:var(--warn);border:2px solid var(--acc);
}
.etab-dot{background:var(--warn)!important}
.tree-row.dirty .tree-name::after{color:var(--warn)}

/* ---------------- editor tabs ---------------- */
/* the wheel is turned into horizontal scrolling in JS - a strip of tabs that only
   moves with Shift held is a dead end when a dozen files are open */
#tabwrap{display:flex;align-items:stretch;background:var(--bg2);border-bottom:1px solid var(--bd);flex:0 0 auto}
#tabwrap[hidden]{display:none}
#tabbar{display:flex;align-items:stretch;flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none}
#tabbar::-webkit-scrollbar{height:0}
/* sits outside the scrolling strip, so it stays put however many tabs are open */
#btnCloseAll{flex:0 0 auto;width:36px;display:grid;place-items:center;border:0;border-left:1px solid var(--bd);background:var(--bg2);color:var(--fg3);cursor:pointer;transition:var(--tr)}
#btnCloseAll:hover{background:var(--bg3);color:var(--danger)}
#btnCloseAll svg{width:15px;height:15px}
.etab{display:flex;align-items:center;gap:7px;padding:0 7px 0 12px;height:33px;border:0;border-right:1px solid var(--bd);border-top:2px solid transparent;background:transparent;color:var(--fg3);cursor:pointer;font-size:12.5px;white-space:nowrap;max-width:220px;flex:0 0 auto}
.etab:hover{background:var(--bg3);color:var(--fg2)}
.etab.active{background:var(--bg);color:var(--fg);border-top-color:var(--acc)}
.etab-name{overflow:hidden;text-overflow:ellipsis}
.etab.dirty .etab-name{font-style:italic}
.etab-x{width:18px;height:18px;display:grid;place-items:center;border:0;background:transparent;color:inherit;border-radius:4px;font-size:12px;line-height:1;opacity:.5;cursor:pointer;flex:0 0 auto}
.etab-x:hover{background:var(--bd2);opacity:1}
.etab-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto;margin:0 5px}
.etab.dirty .etab-x{display:none}
.etab.dirty:hover .etab-x{display:grid}
.etab.dirty:hover .etab-dot{display:none}
.etab-ico{width:13px;height:13px;flex:0 0 auto;opacity:.7}

/* ---------------- file tree ---------------- */
.root-bar{display:flex;align-items:center;gap:2px;padding:0 2px 6px;margin-bottom:2px;border-bottom:1px solid var(--bd)}
.root-name{flex:1;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{width:24px;height:24px;display:grid;place-items:center;border:0;background:transparent;border-radius:5px;color:var(--fg3);cursor:pointer;flex:0 0 auto}
.ibtn:hover{background:var(--bg3);color:var(--fg)}
.ibtn svg{width:14px;height:14px}
.tree-row{display:flex;align-items:center;gap:5px;padding:3px 5px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;user-select:none}
.tree-row:hover{background:var(--bg3);color:var(--fg)}
.tree-row.active{background:var(--accsoft);color:var(--acc);font-weight:600}
.tree-row.dirty .tree-name::after{content:" \25CF";font-size:9px;color:var(--warn)}
.tree-name{overflow:hidden;text-overflow:ellipsis}
.tree-ico{width:14px;height:14px;flex:0 0 auto;opacity:.7}
.tree-chev{width:12px;height:12px;flex:0 0 auto;transition:transform .12s ease;opacity:.55}
.tree-row.open>.tree-chev{transform:rotate(90deg)}
.tree-kids{margin-left:10px;padding-left:4px;border-left:1px solid var(--bd)}
.tree-pad{width:12px;flex:0 0 auto}
/* ---------------- search across the folder ---------------- */
.fs-box{position:sticky;top:-8px;margin:-8px -8px 6px;padding:8px 8px 6px;background:var(--panel);border-bottom:1px solid var(--bd);z-index:2}
#fsInput{width:100%;padding:6px 9px;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--bg);font-size:12.5px}
#fsInput::placeholder{color:var(--fg3)}
.fs-opts{display:flex;align-items:center;gap:10px;margin-top:6px}
#fsSummary{font-size:11px;color:var(--fg3);margin-top:5px}
#fsSummary:empty{display:none}
.sr-file{display:flex;align-items:center;gap:5px;padding:4px 5px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;user-select:none}
.sr-file:hover{background:var(--bg3)}
.sr-file .tree-chev{transform:rotate(90deg)}
.sr-file.shut .tree-chev{transform:none}
.sr-name{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.sr-dir{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:400;color:var(--fg3)}
.sr-n{flex:0 0 auto;margin-left:auto;font-size:10.5px;font-weight:700;color:var(--fg2);background:var(--bg3);border-radius:99px;padding:0 6px}
.sr-hits{margin:0 0 4px 10px;padding-left:4px;border-left:1px solid var(--bd)}
.sr-file.shut+.sr-hits{display:none}
.sr-hit{display:flex;gap:6px;padding:2px 5px;border-radius:var(--r-sm);cursor:pointer;font-size:12px;line-height:1.45;color:var(--fg2)}
.sr-hit:hover{background:var(--bg3);color:var(--fg)}
.sr-hit.cur{background:var(--accsoft);color:var(--fg)}
.sr-ln{flex:0 0 auto;min-width:22px;padding-top:1px;text-align:right;font-family:var(--f-mono);font-size:10.5px;color:var(--fg3)}
.sr-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-txt mark{background:color-mix(in srgb,#ffd84d 70%,transparent);color:inherit;border-radius:2px}
:root[data-theme="dark"] .sr-txt mark{background:color-mix(in srgb,#d29922 55%,transparent)}
.sr-more{font-size:11px;color:var(--fg3);padding:3px 5px 3px 33px}
.hint{font-size:11.5px;color:var(--fg3);line-height:1.6;padding:10px 4px 0;border-top:1px solid var(--bd);margin-top:10px}
.hint code{font-family:var(--f-mono);font-size:10.5px;background:var(--bg3);padding:1px 4px;border-radius:4px}

/* ---------------- menus / modal ---------------- */
/* max-height is set from the viewport when it opens; without it a menu taller
   than the window simply ran off the bottom with no way to reach the rest */
.menu{position:absolute;z-index:60;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow);padding:5px;min-width:212px;
  max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
.menu::-webkit-scrollbar{width:10px}
.menu::-webkit-scrollbar-track{background:transparent}
.menu::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px;border:3px solid var(--bg)}
.menu::-webkit-scrollbar-thumb:hover{background:var(--fg3)}
.menu[hidden]{display:none}
.mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--fg);cursor:pointer;font-size:13px;text-align:left;transition:var(--tr)}
.mi:hover{background:var(--bg3)}
.mi kbd,.k{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--fg3);background:var(--bg3);border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
.mi svg{width:15px;height:15px;color:var(--fg2);flex:0 0 auto}
.mdiv{height:1px;background:var(--bd);margin:5px 3px}
.mlab{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3);padding:7px 9px 3px}
.mrow{display:flex;align-items:center;gap:6px;padding:4px 9px 6px}
.mrow span{font-size:12.5px;color:var(--fg2);flex:1}

.overlay{position:fixed;inset:0;background:rgba(15,20,28,.5);z-index:100;display:grid;place-items:center;padding:20px;backdrop-filter:blur(2px)}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shadow);width:min(680px,100%);max-height:86vh;overflow:auto}
.sheet-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:2}
.sheet-h h2{margin:0;font-size:15px;font-weight:650}
.sheet-b{padding:18px 20px 22px}
.kbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px 26px}
.kbsec h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg3)}
.kbrow{display:flex;align-items:center;gap:10px;padding:3.5px 0;font-size:13px;color:var(--fg2);border-bottom:1px dashed var(--bd)}
.kbrow span{flex:1}

#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,14px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s ease;z-index:200}
#toast.show{opacity:1;transform:translate(-50%,0)}
#drop{position:fixed;inset:0;z-index:150;background:color-mix(in srgb,var(--acc) 14%,transparent);border:3px dashed var(--acc);display:grid;place-items:center;font-size:17px;font-weight:650;color:var(--acc)}
#drop[hidden]{display:none}

/* =========================================================
   Preview typography
   ========================================================= */
#preview{line-height:1.7;word-wrap:break-word}
#preview>*:first-child{margin-top:0}
#preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6{
  margin:1.6em 0 .6em;line-height:1.28;font-weight:650;letter-spacing:-.011em;scroll-margin-top:16px;position:relative}
#preview h1{font-size:1.95em;font-weight:700;letter-spacing:-.02em}
#preview h2{font-size:1.5em;padding-bottom:.28em;border-bottom:1px solid var(--bd)}
#preview h3{font-size:1.24em}
#preview h4{font-size:1.06em}
#preview h5{font-size:.94em}
#preview h6{font-size:.88em;color:var(--fg2)}
#preview .anchor{position:absolute;left:-.72em;top:0;opacity:0;text-decoration:none;color:var(--fg3);font-weight:400;transition:var(--tr)}
#preview h1:hover .anchor,#preview h2:hover .anchor,#preview h3:hover .anchor,
#preview h4:hover .anchor,#preview h5:hover .anchor,#preview h6:hover .anchor{opacity:.55}
#preview .anchor:hover{opacity:1!important;color:var(--acc)}
#preview p{margin:0 0 1.05em}
#preview a{color:var(--acc);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
#preview a:hover{border-bottom-color:var(--acc)}
#preview strong{font-weight:680}
#preview em{font-style:italic}
#preview del{color:var(--fg3)}
#preview mark{background:color-mix(in srgb,#ffd84d 60%,transparent);color:inherit;padding:.05em .22em;border-radius:3px}
:root[data-theme="dark"] #preview mark{background:color-mix(in srgb,#d29922 40%,transparent)}
/* search hits inside the rendered preview - zero padding so nothing reflows */
#preview mark.pv-hit{background:color-mix(in srgb,#ffd84d 78%,transparent);color:inherit;padding:0;border-radius:2px}
#preview mark.pv-hit.cur{background:color-mix(in srgb,var(--acc) 38%,transparent);box-shadow:0 0 0 1.5px var(--acc)}
:root[data-theme="dark"] #preview mark.pv-hit{background:color-mix(in srgb,#d29922 55%,transparent)}
:root[data-theme="dark"] #preview mark.pv-hit.cur{background:color-mix(in srgb,var(--acc) 50%,transparent)}
#findbar input:disabled,#findbar button:disabled{opacity:.4;cursor:not-allowed}
#findMode{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg3);background:var(--bg3);border:1px solid var(--bd);border-radius:99px;padding:2px 9px;white-space:nowrap}
#findMode[hidden]{display:none}
#preview ul,#preview ol{margin:0 0 1.05em;padding-left:1.6em}
#preview li{margin:.28em 0}
#preview li>ul,#preview li>ol{margin:.3em 0}
#preview li::marker{color:var(--fg3)}
#preview .task{list-style:none;margin-left:-1.5em;padding-left:1.5em;position:relative}
#preview .task input{position:absolute;left:0;top:.36em;margin:0;accent-color:var(--acc);width:14px;height:14px;cursor:pointer}
#preview .task.done{color:var(--fg3)}
#preview blockquote{margin:0 0 1.05em;padding:.15em 0 .15em 1.1em;border-left:3px solid var(--bd2);color:var(--fg2)}
#preview blockquote>*:last-child{margin-bottom:0}
#preview hr{border:0;border-top:1px solid var(--bd);margin:2em 0}
#preview img{max-width:100%;height:auto;border-radius:var(--r);display:block;margin:.4em 0}
#preview kbd{font-family:var(--f-mono);font-size:.82em;background:var(--bg3);border:1px solid var(--bd2);border-bottom-width:2px;border-radius:4px;padding:.1em .4em}
#preview code{font-family:var(--f-mono);font-size:.875em;background:var(--code);border:1px solid var(--codebd);border-radius:5px;padding:.12em .36em}
#preview sup,#preview sub{font-size:.74em;line-height:0}

/* tables */
#preview .tw{overflow-x:auto;margin:0 0 1.15em;border:1px solid var(--bd);border-radius:var(--r)}
#preview table{border-collapse:collapse;width:100%;font-size:.925em}
#preview th,#preview td{padding:.5em .8em;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);text-align:left}
#preview th:last-child,#preview td:last-child{border-right:0}
#preview tr:last-child td{border-bottom:0}
#preview thead th{background:var(--bg2);font-weight:650;font-size:.92em}
#preview tbody tr:hover{background:var(--bg2)}

/* code blocks */
#preview .cb{margin:0 0 1.15em;border:1px solid var(--codebd);border-radius:var(--r);overflow:hidden;background:var(--code)}
#preview .cb-h{display:flex;align-items:center;justify-content:space-between;padding:5px 8px 5px 12px;background:var(--codehd);border-bottom:1px solid var(--codebd)}
#preview .cb-l{font-family:var(--f-mono);font-size:10.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
#preview .cb-c{border:0;background:transparent;color:var(--fg3);font-size:11px;font-weight:600;cursor:pointer;padding:3px 7px;border-radius:5px;transition:var(--tr)}
#preview .cb-c:hover{background:var(--bd2);color:var(--fg)}
#preview .cb pre{margin:0;padding:12px 14px;overflow-x:auto}
#preview .cb code{background:none;border:0;padding:0;font-size:.85em;line-height:1.65;display:block}
#preview pre.plain{margin:0 0 1.15em;padding:12px 14px;background:var(--code);border:1px solid var(--codebd);border-radius:var(--r);overflow-x:auto}
#preview pre.plain code{background:none;border:0;padding:0}

.t-com{color:var(--sy-com);font-style:italic}
.t-str{color:var(--sy-str)}
.t-num{color:var(--sy-num)}
.t-kw{color:var(--sy-kw);font-weight:600}
.t-fn{color:var(--sy-fn)}
.t-tag{color:var(--sy-tag)}
.t-attr{color:var(--sy-attr)}
.t-op{color:var(--sy-op)}
.t-var{color:var(--sy-var)}
.t-ins{color:var(--sy-ins)}
.t-del{color:var(--sy-del)}
.t-punct{color:var(--fg2)}

/* callouts */
#preview .callout{margin:0 0 1.15em;padding:.85em 1.05em;border-radius:var(--r);border:1px solid var(--bd);border-left:4px solid var(--c,var(--acc));background:var(--bg2)}
#preview .callout>*:last-child{margin-bottom:0}
#preview .callout-t{display:flex;align-items:center;gap:7px;font-weight:650;color:var(--c,var(--acc));margin-bottom:.45em;font-size:.92em;letter-spacing:.01em}
#preview .callout-t svg{width:16px;height:16px}
#preview .c-note{--c:var(--info)} #preview .c-tip{--c:var(--ok)}
#preview .c-important{--c:var(--purple)} #preview .c-warning{--c:var(--warn)}
#preview .c-caution{--c:var(--danger)}

/* footnotes */
#preview .fnref{font-size:.74em;line-height:0;vertical-align:super}
#preview .fnref a{border:0;padding:0 .12em;font-weight:600}
#preview .footnotes{margin-top:2.6em;padding-top:1.1em;border-top:1px solid var(--bd);font-size:.9em;color:var(--fg2)}
#preview .footnotes ol{padding-left:1.4em}
#preview .fnback{border:0;margin-left:.35em;font-size:.9em;text-decoration:none}
#preview details{margin:0 0 1.05em;border:1px solid var(--bd);border-radius:var(--r);padding:.6em .9em;background:var(--bg2)}
#preview summary{cursor:pointer;font-weight:600}
#preview .search-hit{background:color-mix(in srgb,var(--acc) 30%,transparent);border-radius:2px}
/* the preview block matching the current editor selection */
#preview .sync-hl{
  background:color-mix(in srgb,var(--acc) 12%,transparent);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 12%,transparent);
  border-radius:3px;transition:background .15s ease,box-shadow .15s ease;
}

/* =========================================================
   Responsive + print
   ========================================================= */
#backdrop{
  display:none;position:fixed;inset:0;z-index:75;background:rgba(10,14,20,.45);
  opacity:1;transition:opacity .22s ease;
}

@media (max-width:780px){
  body{font-size:15px}

  /* sidebar becomes a slide-over drawer with a tap-to-dismiss backdrop */
  #sidebar{
    position:fixed;top:0;bottom:0;left:0;z-index:80;width:min(84vw,300px);
    flex-basis:auto;margin-left:0;transform:translateX(0);
    transition:transform .22s ease;box-shadow:var(--shadow);
    padding-left:env(safe-area-inset-left);
  }
  body.no-sidebar #sidebar{margin-left:0;transform:translateX(-102%)}
  #backdrop{display:block}
  body.no-sidebar #backdrop{opacity:0;pointer-events:none}

  /* a split view on a phone is two useless slivers - show one pane at a time */
  body.view-split #panes{grid-template-columns:1fr}
  body.view-split #splitter,body.view-split #previewPane{display:none}
  .seg [data-view="split"]{display:none}
  .seg .btn{height:30px;padding:0 13px;font-size:12.5px}

  /* touch targets */
  .btn{height:36px}
  .btn-ico{width:36px}
  .tb{width:36px;height:36px}
  .tb.txt{width:auto;padding:0 11px}
  #toolbar{flex-wrap:nowrap;overflow-x:auto;gap:2px;padding:5px 6px;scrollbar-width:none}
  #toolbar::-webkit-scrollbar{height:0}
  .sep{margin:0 3px}
  #topbar{padding:7px 8px;gap:5px}
  #docTitle{max-width:none;min-width:0;flex:1}
  .hide-sm{display:none}

  /* 16px stops iOS zooming the page when the editor takes focus */
  #editor,#mirror{font-size:max(16px,var(--ed-size));padding:14px 15px 50vh}
  #preview{padding:18px 16px 50vh;font-size:max(15.5px,var(--pv-size))}
  #preview h1{font-size:1.7em}
  #preview h2{font-size:1.38em}
  #preview .anchor{display:none}

  .etab{height:38px;max-width:62vw}
  #tabbar{padding-left:env(safe-area-inset-left)}
  #status{padding:5px 10px calc(5px + env(safe-area-inset-bottom));gap:12px}
  .side-foot{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  #findbar{gap:5px;padding:6px}
  #findbar input[type=text]{min-width:0;flex:1 1 40%}
  .menu{min-width:min(92vw,268px);max-width:min(94vw,320px)}
  .sheet{max-height:92vh}
  .kbgrid{grid-template-columns:1fr;gap:16px}
  #toast{bottom:calc(58px + env(safe-area-inset-bottom));max-width:86vw;text-align:center}
  #drop{font-size:15px;padding:24px;text-align:center}
}

/* labels are clearer, but on a phone the title field needs the room more */
.seg-ico{display:none}
@media (max-width:480px){
  .seg-ico{display:block;width:16px;height:16px}
  .seg-lab{display:none}
  .seg .btn{padding:0 12px}
  .side-tab{font-size:11px;padding:6px 3px}
  #docTitle{font-size:14px}
}

/* fine for a mouse, too small for a finger */
@media (hover:none){
  .doc-del{opacity:1}
  .etab.dirty .etab-x{display:grid}
  .etab.dirty .etab-dot{display:none}
}
@media print{
  body{overflow:visible;height:auto;background:#fff}
  #app{display:block;height:auto;overflow:visible}
  #sidebar,#topbar,#tabwrap,#toolbar,#status,#findbar,#splitter,#editorPane,.overlay,#toast{display:none!important}
  #panes{display:block;overflow:visible}
  #previewPane{overflow:visible}
  #preview{max-width:none;padding:0;font-size:11.5pt}
  #preview .cb,#preview .tw,#preview pre.plain{break-inside:avoid}
  #preview h1,#preview h2,#preview h3{break-after:avoid}
  #preview .cb-c,#preview .anchor{display:none}
  #preview a{color:#000;border:0}
}
</style>
</head>
<body class="view-split">

<div id="app">
  <!-- ================= sidebar ================= -->
  <aside id="sidebar">
    <div class="side-head">
      <div class="logo"><span class="logo-mark">M</span><span>Markdown Studio</span></div>
    </div>
    <div class="side-tabs" role="tablist">
      <button class="side-tab" id="tabFiles" role="tab" aria-selected="true">Explorer</button>
      <button class="side-tab" id="tabDocs" role="tab" aria-selected="false">Docs</button>
      <button class="side-tab" id="tabToc" role="tab" aria-selected="false">Outline</button>
      <button class="side-tab" id="tabSearch" role="tab" aria-selected="false" title="Search in folder (Ctrl+Shift+F)">Search</button>
    </div>
    <div class="side-body" id="paneFiles"><div id="treeBody"></div></div>
    <div class="side-body" id="paneSearch" hidden>
      <div class="fs-box">
        <input type="text" id="fsInput" placeholder="Search in all files..." autocomplete="off" spellcheck="false">
        <div class="fs-opts">
          <label class="chk" title="Match case"><input type="checkbox" id="fsCase">Aa</label>
          <label class="chk" title="Regular expression"><input type="checkbox" id="fsRe">.*</label>
          <span class="grow"></span>
          <button class="ibtn" id="fsCollapse" title="Collapse / expand all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5-5 5 5M7 20h10M7 4h10"/></svg></button>
          <button class="ibtn" id="fsRefresh" title="Re-read files from disk and search again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.6-6.4M21 3v6h-6"/></svg></button>
        </div>
        <div id="fsSummary"></div>
      </div>
      <div id="fsResults"></div>
    </div>
    <div class="side-body" id="paneDocs" hidden>
      <input type="text" id="docSearch" placeholder="Search documents..." autocomplete="off" spellcheck="false">
      <div id="docList"></div>
    </div>
    <div class="side-body" id="paneToc" hidden><div id="tocList"></div></div>
    <div class="side-foot">
      <button class="btn btn-pri" id="btnNew" style="flex:1" title="New document (Alt+N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New
      </button>
      <button class="btn btn-out btn-ico" id="btnFolder" title="Open folder (Ctrl+Shift+O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      </button>
      <button class="btn btn-out btn-ico" id="btnOpen" title="Open .md file (Ctrl+O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>
      </button>
    </div>
  </aside>

  <!-- ================= main ================= -->
  <div id="main">
    <header id="topbar">
      <button class="btn btn-ico" id="btnSide" title="Toggle sidebar (Ctrl+\)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM9 5v14"/></svg>
      </button>
      <input type="text" id="docTitle" spellcheck="false" aria-label="Document title">
      <span class="grow"></span>
      <div class="seg" role="group" aria-label="View mode">
        <button class="btn" data-view="edit" title="Editor only (Ctrl+1)" aria-label="Editor only">
          <svg class="seg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><span class="seg-lab">Edit</span></button>
        <button class="btn on" data-view="split" title="Split view (Ctrl+2)" aria-label="Split view">
          <svg class="seg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg><span class="seg-lab">Split</span></button>
        <button class="btn" data-view="preview" title="Preview only (Ctrl+3)" aria-label="Preview only">
          <svg class="seg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="seg-lab">Preview</span></button>
      </div>
      <div class="sep hide-sm"></div>
      <button class="btn btn-ico hide-sm" id="btnFind" title="Find and replace (Ctrl+F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="btn btn-ico hide-sm" id="btnTheme" title="Toggle theme (Ctrl+Shift+L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
      <button class="btn btn-ico" id="btnMenu" title="More" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
      </button>
      <button class="btn btn-pri" id="btnSave" title="Save as .md (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l4-4m-4 4l-4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        <span class="hide-sm">Save</span>
      </button>
    </header>

    <div id="tabwrap" hidden>
      <div id="tabbar" role="tablist" aria-label="Open files"></div>
      <button id="btnCloseAll" title="Close all tabs (Ctrl+Alt+Shift+W)" aria-label="Close all tabs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h11a1 1 0 011 1v11"/><rect x="4" y="8" width="12" height="12" rx="1.5"/><path d="M8 12l4 4M12 12l-4 4"/></svg>
      </button>
    </div>

    <div id="toolbar" role="toolbar" aria-label="Formatting"></div>

    <div id="findbar" hidden>
      <input type="text" id="findInput" placeholder="Find" autocomplete="off" spellcheck="false">
      <input type="text" id="replInput" placeholder="Replace with" autocomplete="off" spellcheck="false">
      <span id="findCount">0 / 0</span>
      <button class="btn btn-out" id="findPrev" title="Previous (Shift+Enter)">&#8593;</button>
      <button class="btn btn-out" id="findNext" title="Next (Enter)">&#8595;</button>
      <button class="btn btn-out" id="replOne">Replace</button>
      <button class="btn btn-out" id="replAll">All</button>
      <span id="findMode" hidden title="Preview is read-only, so replace is off">preview &middot; read-only</span>
      <label class="chk"><input type="checkbox" id="findCase">Aa</label>
      <label class="chk"><input type="checkbox" id="findRe">.*</label>
      <span class="grow"></span>
      <button class="btn btn-ico" id="findClose" title="Close (Esc)">&#10005;</button>
    </div>

    <div id="panes">
      <section id="editorPane">
        <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
          placeholder="Start writing Markdown..." aria-label="Markdown source"></textarea>
        <div id="mirror" aria-hidden="true"></div>
      </section>
      <div id="splitter" role="separator" aria-label="Resize panes" tabindex="-1"></div>
      <section id="previewPane"><article id="preview"></article></section>
    </div>

    <footer id="status">
      <span id="saveState"><span class="dot"></span>Saved</span>
      <span><b id="stWords">0</b> words</span>
      <span><b id="stChars">0</b> chars</span>
      <span class="hide-sm"><b id="stLines">0</b> lines</span>
      <span class="hide-sm"><b id="stRead">0</b> min read</span>
      <span class="grow"></span>
      <span id="stCursor">Ln 1, Col 1</span>
    </footer>
  </div>
</div>

<!-- ================= menu ================= -->
<div class="menu" id="menu" hidden role="menu">
  <button class="mi" data-act="open-folder" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    Open folder<kbd>Ctrl Shift O</kbd></button>
  <button class="mi" data-act="save-all" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
    Save all files<kbd>Ctrl Alt S</kbd></button>
  <button class="mi" data-act="close-all" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h11a1 1 0 011 1v11"/><rect x="4" y="8" width="12" height="12" rx="1.5"/><path d="M8 12l4 4M12 12l-4 4"/></svg>

A complete **Markdown editor with live preview** that runs entirely offline. No server, no internet, no install — everything lives in this single HTML file.

> [!TIP]
> Press <kbd>F1</kbd> at any time to see every keyboard shortcut. Your work saves automatically to this browser.

## Quick start

1. Type in the left pane — the preview updates as you write
2. Use the toolbar or shortcuts like <kbd>Ctrl</kbd>+<kbd>B</kbd> for **bold**
3. Hit <kbd>Ctrl</kbd>+<kbd>S</kbd> to save a real `.md` file
4. Drag a `.md` file onto the window, or open a whole folder with <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>O</kbd>

**The rest of this page is a working guide to writing a README.** Every example is
live: read the result on the right, and look at the same place on the left to see
exactly how it was typed. Delete any of it once you are done.

- [Part 1: The basics](#part-1-the-basics)
- [Part 2: Going further](#part-2-going-further)

# Part 1: The basics

## Headings

One `#` per level, a space after the hashes. Give a file a **single** `#` title and
put everything else underneath it.

````markdown
# Project title      (one per file)
## A section
### A subsection
````

Every heading quietly becomes a link target, which is what makes a table of contents
possible — more on that in Part 2.

## Paragraphs and line breaks

A blank line starts a new paragraph. A plain newline does **not** break the line —
the text just keeps flowing, which is usually what you want. To force a break inside
one paragraph, end the line with a backslash. (Two trailing spaces do the same thing
and you will see it in other people's files, but invisible syntax is easy to lose to
an editor that trims whitespace.)

````markdown
These two lines
end up on the same line.

This one breaks \
right here.
````

These two lines
end up on the same line.

This one breaks \
right here.

## Emphasis and inline marks

| You type | You get |
| -------- | ------- |
| `**bold**` | **bold** |
| `*italic*` | *italic* |
| `***both***` | ***both*** |
| `~~struck out~~` | ~~struck out~~ |
| `` `inline code` `` | `inline code` |
| `==highlighted==` | ==highlighted== |
| `H~2~O` | H~2~O |
| `x^2^` | x^2^ |

Use `` ` `` around anything the reader might otherwise mistype: file names, flags,
commands, values. In a README that matters more than bold does.

## Lists

Indent by two spaces to nest. Numbered lists renumber themselves, so you can leave
every line as `1.` while drafting and the output still counts correctly.

````markdown
- Unordered items
- Nested structure
  - One level deeper
  - And another

1. Ordered lists
2. Count themselves
3. Automatically
````

- Unordered items
- Nested structure
  - One level deeper
  - And another

1. Ordered lists
2. Count themselves
3. Automatically

To put a code block or a paragraph **inside** a list item, indent it to line up with
the item's text:

1. Install it:

   ```shell
   npm install my-package
   ```

2. Then run it. The indentation is what keeps this step attached to item 2.

## Links and images

````markdown
[link text](https://example.com)
[with a tooltip](https://example.com "Shown on hover")
![alt text](path/to/image.png)
<https://example.com>
````

An image is a link with a `!` in front. Always write real alt text — it is what
someone hears when the image cannot be seen, and what shows if the file goes missing.

Links to **other Markdown files work here**: `[the guide](docs/guide.md)` opens that
file as a tab instead of leaving the page, as long as you opened the folder.

## Code

Inline for short things. Fenced blocks for anything you expect to be copied — and
always name the language, which is what turns highlighting on.

````markdown
```js
const greet = (name = "world") => `Hello, ${name}!`;
```
````

console.log(greet("Markdown"));
```

def fib(n: int) -> list[int]:
    """Classic sequence, iterative."""
    out, a, b = [], 0, 1
    for _ in range(n):
        out.append(a)
        a, b = b, a + b
    return out
```

## Quotes

> A plain blockquote for quiet asides.
> It can span multiple lines.
>
> > And nest, if you really need it to.

## Tables

The header row and the dashed row are required. The colons in the dashed row set the
alignment: left, `:-:` centred, `-:` right.

````markdown
| Feature | Shortcut | Works offline |
| ------- | :------: | ------------: |
| Bold    | `Ctrl+B` |           Yes |
````

| Bold             | `Ctrl+B`       |           Yes |
| Link             | `Ctrl+K`       |           Yes |
| Find and replace | `Ctrl+F`       |           Yes |

To put a literal `|` inside a cell, escape it as `\|`.

## Horizontal rules

Three or more dashes on their own line. Useful between major parts of a long README,
but easy to overuse.

# Part 2: Going further

## Callouts

Five kinds, and they render as coloured panels. Reach for these instead of writing
**Note:** in bold.

````markdown
> [!NOTE]
> Useful context the reader should know.
````

> [!NOTE]
> Useful context the reader should know.

> [!TIP]
> A shortcut or a better way of doing it.

> [!IMPORTANT]
> Something they must not skip.

> [!WARNING]
> Something that can go wrong.

> [!CAUTION]
> Something with consequences that are hard to undo.

## Task lists

- [x] Checkboxes are clickable
- [x] Clicking one edits the source for you
- [ ] Useful for a roadmap section

## Footnotes

Keep a heavy aside out of the sentence[^why] and let it collect itself at the bottom.

[^why]: Like this. The marker can be any label — `[^why]`, `[^1]` — and the order in
the output follows the order they are referenced, not the order you wrote them.

## Collapsible sections

Long output, full logs, and rarely-needed detail belong behind a fold.

<details>
<summary>Click to expand</summary>

A safe subset of HTML is supported, so <b>details</b>, <kbd>kbd</kbd> and
<mark>mark</mark> all work. Leave a blank line after the summary and you can use
normal Markdown in here:

- including lists
- and `code`

</details>

## Reference-style links

When the same link appears repeatedly, or a URL is long enough to wreck the sentence,
define it once at the bottom. The prose stays readable, and you fix a moved URL in one
place.

````markdown
See the [docs][d] and the [changelog][c].

[d]: https://example.com/docs
[c]: https://example.com/changelog
````

Badges are just reference links with an image inside — the shields.io style row at the
top of most READMEs is nothing more than this.

## Anchors and a table of contents

Every heading gets an id derived from its text: lowercased, punctuation dropped,
spaces turned into dashes. `## Quick start` becomes `#quick-start`. A repeated
heading gets `-1`, `-2` appended.

````markdown
- [Quick start](#quick-start)
- [Going further](#part-2-going-further)
````

That is all a table of contents is. It is worth adding once a README passes roughly
two screens.

> [!NOTE]
> Characters outside plain ASCII survive into the id — a heading written with an em
> dash keeps it. Click your own links in preview once before you commit them.

## Keys, marks and small text

Press <kbd>Ctrl</kbd>+<kbd>S</kbd> to save. Write keys as `<kbd>Ctrl</kbd>`, call
something out with `==highlight==`, and use `H~2~O` and `x^2^` for sub and superscript.

## Inline HTML

Handy for the one thing Markdown cannot do — usually a centred header block:

<div align="center">
  <b>Markdown Studio</b><br>
  <i>an offline editor in a single file</i>
</div>

Scripts and event handlers are stripped, so a pasted README cannot run anything here.

## Escaping and comments

Put a backslash in front of a character to show it literally: `\*not italic\*` gives
\*not italic\*. The same works for `` \` ``, `\_`, `\#` and `\|`.

To leave a note for yourself that readers never see, use an HTML comment. There is one
on the next line, and it renders as nothing at all.

# Part 3: A README worth reading

Someone landing on your project asks three things in order: **what is this, does it
solve my problem, and how do I start?** Answer those in the first screen and the rest
can be as long as it needs to be.

## A skeleton to start from

````markdown
# Project name

One sentence on what it does and who it is for.

## Install

```shell
npm install project-name
```

## Usage

The smallest example that actually runs.

## Configuration

A table of options, defaults, and what each one changes.

## Contributing

How to set up a dev environment and what you expect in a pull request.

## License

MIT — see LICENSE.
````

## What separates a good one

- **Lead with the sentence, not the badges.** Someone should know whether to keep
  reading before they scroll.
- **The first example must run as written.** No placeholders, no missing import, no
  step that "obviously" comes first.
- **Say what it does not do.** Scope and known limits save more time than any feature
  list.
- **Show output, not just commands.** A block of what they should see beats a
  paragraph describing it.
- **Prefer a table** for anything with more than three options.
- **Fold away the long parts** with `<details>` rather than deleting them.
- **Write the install section last**, after you have followed your own steps on a
  clean machine.

> [!TIP]
> Press <kbd>Ctrl</kbd>+<kbd>3</kbd> for preview only and read it top to bottom as a
> stranger would. Most README problems are visible within ten seconds of doing that.

    const dirs = { "": rootNode };
    paths.forEach(p => {
      const parts = String(p).split("/");
      let cur = rootNode, prefix = "";
      for (let i = 0; i < parts.length - 1; i++) {
        prefix = prefix ? prefix + "/" + parts[i] : parts[i];
        let node = dirs[prefix];
        if (!node) {
          node = { name: parts[i], path: prefix, kind: "dir", kids: [], open: false };
          dirs[prefix] = node;
          cur.kids.push(node);
        }
        cur = node;
      }
      cur.kids.push({ name: parts[parts.length - 1], path: p, kind: "file", srv: true });
    });
    const by = (a, b) => (a.kind === b.kind
      ? a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" })
      : a.kind === "dir" ? -1 : 1);
    (function sortAll(n) { if (!n.kids) return; n.kids.sort(by); n.kids.forEach(sortAll); })(rootNode);
    return rootNode;
  }

  async function loadServerWorkspace(openFiles) {
    if (!SRV_KEY) return false;
    let ws;
    try {
      const r = await fetch(srvUrl("/__ws", null));
      if (!r.ok) return false;
      ws = await r.json();
    } catch (e) { return false; }
    if (!ws || !ws.root) return false;               /* launched with no file */

    /* a refresh should not collapse every folder you had expanded */
    const wasOpen = {};
    if (tree && root && root.mode === "server")
      (function walk(n) { if (n.kind === "dir") { wasOpen[n.path] = n.open; (n.kids || []).forEach(walk); } })(tree);

    dropSearchCache();
    root = { name: ws.root, handle: null, mode: "server", readonly: false, disk: ws.path || "" };
    tree = treeFromPaths(ws.root, ws.files || []);
    (function walk(n) {
      if (n.kind === "dir" && wasOpen[n.path] !== undefined) n.open = wasOpen[n.path];
      (n.kids || []).forEach(walk);
    })(tree);

    showSideTab("files");
    renderTree();

    if (openFiles) {
      for (const p of (ws.open || [])) {
        const n = await findFileNode(p);
        if (n) await openFileNode(n);
        else toast("Could not find " + p);
      }
    }
    return true;
  }

  function closeFolder() {
    if (tabs.some(t => t.kind === "file" && isDirty(t)) &&
      !confirm("Some open files have unsaved changes. Close the folder anyway?")) return;
    tabs.filter(t => t.kind === "file").forEach(t => { tabs = tabs.filter(x => x.id !== t.id); });
    root = null; tree = null; reopen = null;
    dropSearchCache();
    idbSet("root", null);
    if (!$("#paneSearch").hidden) runFolderSearch();
    if (!tabs.length) ensureTab(); else activateTab(tabs[0].id, true);
    renderTree();
    toast("Folder closed");
  }

  async function newFileInFolder() {
    if (!root || root.readonly || (root.mode !== "fs" && root.mode !== "server")) return;
    let name = prompt("New file name:", "untitled.md");
    if (!name) return;
    name = name.trim().replace(/[\\/:*?"<>|]/g, "-");
    if (!MD_EXT.test(name)) name += ".md";

    if (root.mode === "server") {
      try {
        await srvWrite(name, "# " + name.replace(MD_EXT, "") + "\n\n");
        await loadServerWorkspace(false);
        const n = await findFileNode(name);
        if (n) openFileNode(n);
      } catch (e) { toast("Could not create file: " + (e.message || e.name)); }
      return;
    }

    try {
      const h = await root.handle.getFileHandle(name, { create: true });
      const w = await h.createWritable();
      await w.write("# " + name.replace(MD_EXT, "") + "\n\n");
      await w.close();
      await loadDir(tree);
      renderTree();
      openFileNode({ name: name, path: name, kind: "file", handle: h });
    } catch (e) { toast("Could not create file: " + (e.message || e.name)); }
  }

  /* ---------- tree rendering ---------- */
  function renderTree() {
    const el = $("#treeBody");
    if (!root) {
      el.innerHTML =
        '<div class="empty" style="padding:18px 6px">No folder open.<br>Open one to browse and edit<br>all its Markdown files.</div>' +
        '<button class="btn btn-pri" data-fs="open" style="width:100%">Open Folder</button>' +
        (reopen ? '<button class="btn btn-out" data-fs="reopen" style="width:100%;margin-top:6px">Reopen ' + esc(reopen.name) + "</button>" : "") +
        (location.protocol === "file:"
          ? '<div class="hint">Opened straight from a file, so folders here are <b>read-only</b>. To edit files in place, serve this app with laragon at <code>http://localhost/MDpreviewer/</code>.</div>'
          : "");
      return;
    }
    nodeByPath.clear();
    el.innerHTML =
      '<div class="root-bar"><span class="root-name" title="' + esc(root.disk || root.name) + '">' + esc(root.name) +
      (root.readonly ? " (read-only)" : "") + "</span>" +
      ((root.mode === "fs" || root.mode === "server") && !root.readonly
        ? '<button class="ibtn" data-fs="new" title="New file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>'
        : "") +
      (root.mode === "fs" || root.mode === "server"
        ? '<button class="ibtn" data-fs="refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.6-6.4M21 3v6h-6"/></svg></button>'
        : "") +
      '<button class="ibtn" data-fs="close" title="Close folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>' +
      (tree.kids && tree.kids.length ? tree.kids.map(renderNode).join("")
        : '<div class="empty">No Markdown files here.</div>');
  }

  function renderNode(n) {
    nodeByPath.set(n.path, n);
    if (n.kind === "dir") {
      return '<div class="tree-row' + (n.open ? " open" : "") + '" data-path="' + esc(n.path) + '">' +
        ICO_CHEV + ICO_DIR + '<span class="tree-name">' + esc(n.name) + "</span></div>" +
        (n.open ? '<div class="tree-kids">' + (n.kids || []).map(renderNode).join("") + "</div>" : "");
    }
    const tab = tabs.find(t => t.kind === "file" && t.path === n.path);
    return '<div class="tree-row' + (tab && tab.id === activeTab ? " active" : "") +
      (tab && isDirty(tab) ? " dirty" : "") + '" data-path="' + esc(n.path) + '" title="' + esc(n.path) + '">' +
      '<span class="tree-pad"></span>' + ICO_FILE + '<span class="tree-name">' + esc(n.name) + "</span></div>";
  }

  /* ---------- tabs ---------- */
  function renderTabs() {
    const bar = $("#tabbar");
    const show = tabs.length > 1 || tabs.some(t => t.kind === "file");
    $("#tabwrap").hidden = !show;
    if (!show) { bar.innerHTML = ""; return; }
    bar.innerHTML = tabs.map(t => {
      const d = isDirty(t);
      return '<div class="etab' + (t.id === activeTab ? " active" : "") + (d ? " dirty" : "") +
        '" data-tab="' + t.id + '" role="tab" title="' + esc(t.path || t.name) + '">' +
        (t.kind === "file" ? ICO_TAB_F : ICO_TAB_D) +
        '<span class="etab-name">' + esc(t.name) + "</span>" +
        (d ? '<span class="etab-dot"></span>' : "") +
        '<button class="etab-x" data-close="' + t.id + '" aria-label="Close ' + esc(t.name) + '">&#10005;</button></div>';
    }).join("");
    const cur = bar.querySelector(".etab.active");
    if (cur) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function stashActive() {
    const t = active();
    if (!t) return;
    t.content = ed.value;
    t.scrollTop = ed.scrollTop;
    t.cursor = ed.selectionStart;
  }

  function activateTab(id, skipStash) {
    if (activeTab && activeTab !== id && !skipStash) stashActive();
    const t = tabs.find(x => x.id === id);
    if (!t) return;
    activeTab = id;
    ed.value = t.content;
    const title = $("#docTitle");
    title.value = t.name;
    title.readOnly = isBound(t);
    title.title = t.path || t.name;
    if (t.kind === "local") state.active = t.docId;
    renderNow();
    ed.scrollTop = t.scrollTop || 0;
    previewPane.scrollTop = 0;
    try { ed.setSelectionRange(t.cursor || 0, t.cursor || 0); } catch (e) { }
    renderTabs(); renderTree(); renderDocs(); updateCursor();
    /* the hits belong to the document we just left, so recompute against this one */
    if (findHL && !previewMode()) runFind();
    updateSaveUI();
  }

  function closeTab(id) {
    const i = tabs.findIndex(t => t.id === id);
    if (i < 0) return;
    const t = tabs[i];
    if (t.id === activeTab) stashActive();
    if (isDirty(t) && !confirm('"' + t.name + '" has unsaved changes. Close it anyway?')) return;
    const wasActive = activeTab === id;
    tabs.splice(i, 1);
    if (!wasActive) { renderTabs(); renderTree(); return; }
    activeTab = null;
    if (tabs.length) activateTab(tabs[Math.min(i, tabs.length - 1)].id, true);
    else ensureTab();
  }

  /* one confirm for the lot instead of one per unsaved tab */
  function closeAllTabs() {
    stashActive();
    const n = tabs.length;
    const dirty = tabs.filter(isDirty);
    if (dirty.length && !confirm(dirty.length + " open file" + (dirty.length === 1 ? " has" : "s have") +
      " unsaved changes. Close all tabs anyway?")) return;
    tabs = []; activeTab = null;
    ensureTab();
    toast("Closed " + n + " tab" + (n === 1 ? "" : "s"));
  }

  function cycleTab(d) {
    if (tabs.length < 2) return;
    const i = tabs.findIndex(t => t.id === activeTab);
    activateTab(tabs[(i + d + tabs.length) % tabs.length].id);
  }

  async function openFileNode(n) {
    const open = tabs.find(t => t.kind === "file" && t.path === n.path);
    if (open) { activateTab(open.id); return; }
    let text = "";
    try { text = await readNodeText(n); }
    catch (e) { toast("Could not read " + n.name); return; }
    /* Windows editors like to prefix UTF-8 with a BOM; left in, it sits invisibly
       in front of the first "#" and stops it being read as a heading */
    const bom = text.charCodeAt(0) === 0xFEFF;
    text = text.replace(/^﻿/, "");
    /* A textarea silently drops the \r from CRLF, so a Windows file compared
       against what it was read as looks edited the instant it opens. Edit in LF
       and put the file's own convention back when it is written. */
    const eol = /\r\n/.test(text) ? "\r\n" : "\n";
    text = text.replace(/\r\n?/g, "\n");
    stashActive();
    const tab = {
      id: uid(), kind: "file", name: n.name, path: n.path,
      handle: n.handle || null, srv: !!n.srv, readonly: !n.handle && !n.srv,
      content: text, saved: text, eol: eol, bom: bom, scrollTop: 0, cursor: 0
    };
    tabs.push(tab);
    activateTab(tab.id, true);
  }

  /* the raw text on disk, whichever way the folder was opened */
  async function readNodeText(n) {
    if (n.srv) return srvRead(n.path);
    const f = n.handle ? await n.handle.getFile() : n.file;
    return f.text();
  }

  /* ---------- searching every file in the opened folder ---------- */
  /* Files are read once and cached, so typing a query does not re-read the whole
     folder on every key. An open tab is searched by its buffer instead, so hits
     line up with what is in the editor, unsaved edits included. */
  const fileCache = new Map();          /* path -> text, LF and no BOM, as on disk */
  const FS_MAX_ROWS = 1500;
  let fsRun = 0, fsTimer = null, fsLast = null, fsNodes = new Map(), fsShut = new Set();

  let fsBulk = null, cacheGen = 0;      /* the exe's one-shot read of the whole folder */

  const normText = s => s.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  function dropSearchCache() { fileCache.clear(); fsBulk = null; cacheGen++; }

  /* The exe can send every file in one response; without that, a folder of a
     few hundred notes costs a few hundred requests. Anything it leaves out
     (a size cap, or an older exe with no /__all) is read one by one after.
     Shared as a promise, so a search typed while it loads waits for it too. */
  function prefetchServerFiles() {
    if (!root || root.mode !== "server") return Promise.resolve();
    if (!fsBulk) fsBulk = (async () => {
      const gen = cacheGen;
      try {
        const r = await fetch(srvUrl("/__all", null));
        if (!r.ok) return;
        const all = await r.json();
        if (gen !== cacheGen) return;            /* the folder was reloaded meanwhile */
        Object.keys(all).forEach(p => { if (!fileCache.has(p)) fileCache.set(p, normText(all[p])); });
      } catch (e) { }
    })();
    return fsBulk;
  }

  async function allFileNodes() {
    const out = [];
    async function walk(n) {
      if (n.kind === "file") { out.push(n); return; }
      if (n.kids === null && n.handle) await loadDir(n);
      for (const k of n.kids || []) await walk(k);
    }
    if (tree) await walk(tree);
    return out;
  }

  async function searchText(n) {
    const tab = tabs.find(t => t.kind === "file" && t.path === n.path);
    if (tab) return bufOf(tab);
    if (fileCache.has(n.path)) return fileCache.get(n.path);
    const text = normText(await readNodeText(n));
    fileCache.set(n.path, text);
    return text;
  }

  function searchRegex(q, cs, re) {
    try { return new RegExp(re ? q : q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g" + (cs ? "" : "i")); }
    catch (e) { return null; }
  }

  /* hits grouped by line: [{line, pos (offset of the first hit), ord, text, spans}] */
  function hitsByLine(text, rx) {
    const rows = [];
    let m, guard = 0, ord = 0, line = 0, ls = 0, row = null;
    rx.lastIndex = 0;
    while ((m = rx.exec(text)) !== null && guard++ < 20000) {
      if (m[0] === "") { rx.lastIndex++; continue; }
      const at = m.index;
      /* matches only move forward, so walk the line counter along with them */
      let nl;
      while ((nl = text.indexOf("\n", ls)) !== -1 && nl < at) { line++; ls = nl + 1; }
      if (!row || row.line !== line) {
        let le = text.indexOf("\n", ls);
        if (le === -1) le = text.length;
        row = { line: line, pos: at, ord: ord, text: text.slice(ls, le), spans: [] };
        rows.push(row);
      }
      row.spans.push([at - ls, Math.min(at - ls + m[0].length, row.text.length)]);
      ord++;
    }
    return { rows: rows, count: ord };
  }

  /* a window of the line around the first hit, with every hit in it marked */
  function snippet(row) {
    const L = row.text;
    let s = Math.max(0, row.spans[0][0] - 28);
    if (s === 0) s = L.length - L.replace(/^\s+/, "").length;
    if (s > row.spans[0][0]) s = row.spans[0][0];
    const e = Math.min(L.length, s + 180);
    let out = s > 0 && /\S/.test(L.slice(0, s)) ? "&hellip;" : "", cx = s;
    row.spans.forEach(sp => {
      const a = Math.max(sp[0], cx), b = Math.min(sp[1], e);
      if (b <= a) return;
      out += esc(L.slice(cx, a)) + "<mark>" + esc(L.slice(a, b)) + "</mark>";
      cx = b;
    });
    return out + esc(L.slice(cx, e));
  }

  function queueFolderSearch(delay) {
    clearTimeout(fsTimer);
    fsTimer = setTimeout(runFolderSearch, delay == null ? 250 : delay);
  }

  async function runFolderSearch() {
    clearTimeout(fsTimer);
    const run = ++fsRun;
    const q = $("#fsInput").value, cs = $("#fsCase").checked, re = $("#fsRe").checked;
    const sum = $("#fsSummary"), out = $("#fsResults");
    if (!root) {
      sum.textContent = "";
      out.innerHTML = '<div class="empty">Open a folder to search<br>across all of its files.</div>' +
        '<button class="btn btn-pri" data-fs-open style="width:100%">Open Folder</button>';
      return;
    }
    if (!q) { sum.textContent = ""; out.innerHTML = ""; fsLast = null; return; }
    const rx = searchRegex(q, cs, re);
    if (!rx) { sum.textContent = "Invalid regular expression"; out.innerHTML = ""; return; }

    sum.textContent = "Searching...";
    stashActive();
    const nodes = await allFileNodes();
    await prefetchServerFiles();
    if (run !== fsRun) return;

    const found = [];
    let hits = 0, rows = 0, failed = 0;
    /* a few reads at a time: quick on a local disk, polite to the exe's server */
    for (let i = 0; i < nodes.length; i += 8) {
      const batch = nodes.slice(i, i + 8);
      const texts = await Promise.all(batch.map(n => searchText(n).catch(() => null)));
      if (run !== fsRun) return;                     /* a newer query took over */
      texts.forEach((text, j) => {
        if (text == null) { failed++; return; }
        const r = hitsByLine(text, rx);
        if (!r.count) return;
        hits += r.count;
        found.push({ node: batch[j], rows: r.rows, count: r.count });
        rows += r.rows.length;
      });
    }

    fsLast = { q: q, cs: cs, re: re };
    fsNodes = new Map(found.map(f => [f.node.path, f.node]));
    sum.textContent = hits
      ? hits.toLocaleString() + " result" + (hits === 1 ? "" : "s") + " in " + found.length +
        " file" + (found.length === 1 ? "" : "s") + (failed ? " (" + failed + " unreadable)" : "")
      : "No results in " + nodes.length + " file" + (nodes.length === 1 ? "" : "s");

    let shown = 0;
    out.innerHTML = found.map(f => {
      const p = f.node.path, i = p.lastIndexOf("/");
      let html = '<div class="sr-file' + (fsShut.has(p) ? " shut" : "") + '" data-sr-file="' + esc(p) + '" title="' + esc(p) + '">' +
        ICO_CHEV + ICO_FILE + '<span class="sr-name">' + esc(f.node.name) + "</span>" +
        '<span class="sr-dir">' + (i > 0 ? esc(p.slice(0, i)) : "") + "</span>" +
        '<span class="sr-n">' + f.count + "</span></div><div class=\"sr-hits\">";
      for (const r of f.rows) {
        if (shown >= FS_MAX_ROWS) break;
        shown++;
        html += '<div class="sr-hit" data-sr-path="' + esc(p) + '" data-sr-pos="' + r.pos + '" data-sr-ord="' + r.ord +
          '" title="' + esc(r.text.trim().slice(0, 300)) + '"><span class="sr-ln">' + (r.line + 1) + "</span>" +
          '<span class="sr-txt">' + snippet(r) + "</span></div>";
      }
      return html + "</div>";
    }).join("") + (shown < rows ? '<div class="sr-more">Showing the first ' + FS_MAX_ROWS.toLocaleString() +
      " lines - narrow the search to see the rest</div>" : "");
  }

  /* opens the file and hands the query to the find bar, landing on that exact hit */
  async function openSearchHit(el) {
    const n = fsNodes.get(el.dataset.srPath);
    if (!n || !fsLast) return;
    const pos = +el.dataset.srPos, ord = +el.dataset.srOrd;
    document.querySelectorAll(".sr-hit.cur").forEach(x => x.classList.remove("cur"));
    el.classList.add("cur");
    await openFileNode(n);

    $("#findInput").value = fsLast.q;
    $("#findCase").checked = fsLast.cs;
    $("#findRe").checked = fsLast.re;
    $("#findbar").hidden = false;
    findHL = true;
    setReplaceEnabled(!previewMode());
    runFind();
    const n2 = totalHits();
    if (!n2) return;
    if (previewMode()) mIndex = Math.min(ord, n2 - 1);
    else {
      const k = matches.findIndex(m => m[0] === pos);
      mIndex = k >= 0 ? k : Math.min(ord, n2 - 1);
    }
    $("#findCount").textContent = (mIndex + 1) + " / " + n2;
    if (previewMode()) pvFocus(); else focusMatch();
    autoCloseSide();
  }

  function showFolderSearch() {
    if (!state.settings.sidebar) setSidebar(true);
    const sel = ed.value.slice(ed.selectionStart, ed.selectionEnd);
    if (sel && sel.length < 90 && sel.indexOf("\n") === -1) $("#fsInput").value = sel.trim();
    showSideTab("search");
    $("#fsInput").focus();
    $("#fsInput").select();
  }

  /* ---------- following links from one file to another ---------- */

  /* "../notes.md" seen from "docs/guide.md" -> "notes.md" */
  function resolveRel(fromPath, href) {
    const base = fromPath ? fromPath.split("/").slice(0, -1) : [];
    const out = href.charAt(0) === "/" ? [] : base.slice();
    const segs = href.replace(/^\/+/, "").split("/");
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (!s || s === ".") continue;
      if (s === "..") { out.pop(); continue; }
      out.push(s);
    }
    return out.join("/");
  }

  /* walks the tree by path, opening directories on the way if needed */
  async function findFileNode(path) {
    if (!tree) return null;
    const parts = path.split("/").filter(p => p);
    if (!parts.length) return null;
    let node = tree;
    for (let i = 0; i < parts.length; i++) {
      if (!node.kids && node.handle) await loadDir(node);
      const kids = node.kids || [];
      const last = i === parts.length - 1;
      const want = parts[i].toLowerCase();
      let next = kids.find(k => k.name.toLowerCase() === want &&
        (last ? k.kind === "file" : k.kind === "dir"));
      /* a link written without the extension still finds the file */
      if (!next && last && want.indexOf(".") === -1)
        next = kids.find(k => k.kind === "file" &&
          k.name.toLowerCase().replace(MD_EXT, "") === want);
      if (!next) return null;
      node = next;
    }
    return node.kind === "file" ? node : null;
  }

  function scrollToAnchor(id) {
    if (!id) return;
    let el = null;
    try { el = preview.querySelector('[id="' + CSS.escape(id) + '"]'); } catch (e) { }
    if (!el) return;
    /* measured from the rects, so it does not depend on which ancestor happens
       to be positioned, and assigned directly because it always takes effect */
    const delta = el.getBoundingClientRect().top - previewPane.getBoundingClientRect().top;
    previewPane.scrollTop = Math.max(0, previewPane.scrollTop + delta - 16);
  }

  /* Opens the linked file as a tab instead of letting the browser navigate away,
     which would throw the whole app (and anything unsaved) out of the window. */
  async function followLink(href) {
    const h = href.indexOf("#");
    const hash = h >= 0 ? href.slice(h + 1) : "";
    let path = h >= 0 ? href.slice(0, h) : href;
    try { path = decodeURIComponent(path); } catch (e) { }

    if (!path) { scrollToAnchor(hash); return; }           /* plain #anchor */
    if (!root) { toast("Open a folder first to follow links between files"); return; }

    const t = active();
    const target = resolveRel(t && t.kind === "file" ? t.path : "", path);
    const node = await findFileNode(target);
    if (!node) { toast('"' + path + '" is not in the opened folder'); return; }

    const already = tabs.some(x => x.kind === "file" && x.path === node.path && x.id === activeTab);
    await openFileNode(node);
    if (hash) setTimeout(() => scrollToAnchor(hash), already ? 0 : 140);
  }

  /* ---------- local (browser-stored) documents ---------- */
  function openDoc(id) {
    const d = state.docs.find(x => x.id === id);
    if (!d) return;
    const open = tabs.find(t => t.kind === "local" && t.docId === id);
    if (open) { open.content = d.content || ""; activateTab(open.id); return; }
    stashActive();
    const tab = {
      id: uid(), kind: "local", docId: id, name: d.name || "Untitled", path: "",
      content: d.content || "", saved: d.content || "", scrollTop: 0, cursor: 0
    };
    tabs.push(tab);
    activateTab(tab.id, true);
